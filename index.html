            { id: 48, name: "Ramshej Fort", marathiName: "किल्ले रामशेज", category: "forts", badge: "⛰️ मराठा शौर्य इतिहास", area: "Dindori Road", image: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600&auto=format&fit=crop&q=80", desc: "छत्रपती संभाजी महाराजांच्या काळात मावळ्यांनी मुघल सैन्याविरुद्ध तब्बल साडेपाच वर्षे झुंज दिलेला किल्ला.", highlight: "Historic 5.5 Year Battle Resistance", mapQuery: "Ramshej Fort Nashik", timing: "Sunrise to Sunset" },
            { id: 49, name: "Salher & Mulher Forts", marathiName: "साल्हेर आणि मुल्हेर दुर्ग", category: "forts", badge: "⛰️ २ ऱ्या क्रमांकाचे शिखर", area: "Baglan", image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600&auto=format&fit=crop&q=80", desc: "महाराष्ट्रातील दुसऱ्या क्रमांकाचे सर्वोच्च शिखर (१५६७ मी.) आणि ऐतिहासिक साल्हेर युद्धाची भूमी.", highlight: "Highest Fort Peak (1567m) & History", mapQuery: "Salher Fort Baglan Nashik", timing: "Full Day Trek" },
            { id: 50, name: "Pandavleni Buddhist Caves", marathiName: "पांडवलेणी (त्रिरश्मी बौद्ध लेणी)", category: "forts", badge: "🏛️ प्राचीन बौद्ध लेणी", area: "Nashik-Mumbai Highway", image: "https://images.unsplash.com/photo-1544816155-12df9643f363?w=600&auto=format&fit=crop&q=80", desc: "इसवी सन पूर्व दुसऱ्या शतकातील २४ प्राचीन कातळ-कोरीव बौद्ध लेणी, शिलालेख आणि चैत्यगृह.", highlight: "24 Rock-cut Caves & City View", mapQuery: "Pandav Leni Caves Nashik", timing: "8:00 AM - 6:00 PM" }
        ];

        // State Management
        let currentCategory = 'all';
        let userPlan = JSON.parse(localStorage.getItem('godaNashikPlan')) || [];

        const categoryLabels = {
            all: "सर्व ठिकाणे",
            misal: "नाशिक मिसळ",
            temples: "मंदिरे व तीर्थ",
            street: "स्ट्रीट फूड & मिठाई",
            cafes: "कॅफेज",
            nonveg: "नॉन-व्हेज & बिर्याणी",
            defense: "डिफेन्स & अभिमान",
            wine: "वाइन & कृषी पर्यटन",
            forts: "किल्ले, लेणी व ट्रेक्स"
        };

        const facts = [
            "सुखोई Su-30 MKI लढाऊ विमाने नाशिकच्या ओझर (HAL) येथे तयार होतात!",
            "नाशिकचे कपाळेश्वर मंदिर हे जगातील एकमेव शिवमंदिर आहे जिथे नंदी नाही.",
            "किल्ले रामशेज मुघलांविरुद्ध तब्बल साडेपाच वर्षे अजिंक्य राहिला होता.",
            "मांगी-तुंगी येथे भगवान ऋषभदेवांची १०८ फूट उंच अखंड पाषाणातील मूर्ती आहे.",
            "नाशिक हे भारताची 'Wine Capital' मानले जाते, जिथून देश-विदेशात वाइन जाते."
        ];
        let factIdx = 0;

        function nextFact() {
            factIdx = (factIdx + 1) % facts.length;
            document.getElementById('factText').innerText = facts[factIdx];
        }

        // Render Spot Cards
        function renderSpots(spotsToRender) {
            const container = document.getElementById('spotsGrid');
            const noResults = document.getElementById('noResults');
            const countLabel = document.getElementById('spotsCount');

            container.innerHTML = '';
            countLabel.innerText = `${spotsToRender.length} पैकी ठिकाणे दाखवत आहे`;

            if (spotsToRender.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            spotsToRender.forEach(spot => {
                const isSaved = userPlan.includes(spot.id);
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl overflow-hidden shadow-sm border border-stone-200 transition hover:shadow-md";
                card.innerHTML = `
                    <div class="relative h-44 w-full overflow-hidden bg-stone-100">
                        <img src="${spot.image}" alt="${spot.name}" class="w-full h-full object-cover">
                        <span class="absolute top-2.5 left-2.5 bg-stone-900/80 backdrop-blur-sm text-amber-400 font-bold text-[10px] px-2.5 py-1 rounded-full border border-amber-500/30">
                            ${spot.badge}
                        </span>
                        <button onclick="toggleSaveSpot(${spot.id})" class="absolute top-2.5 right-2.5 w-8 h-8 rounded-full flex items-center justify-center backdrop-blur-md transition ${isSaved ? 'bg-rose-600 text-white' : 'bg-black/40 text-white hover:bg-black/60'}">
                            <i class="fa-${isSaved ? 'solid' : 'regular'} fa-heart text-xs"></i>
                        </button>
                    </div>
                    <div class="p-4">
                        <div class="flex items-start justify-between gap-2 mb-1">
                            <div>
                                <h2 class="text-sm font-bold text-stone-900 leading-tight">${spot.name}</h2>
                                <h3 class="text-xs font-semibold text-amber-900">${spot.marathiName}</h3>
                            </div>
                            <span class="text-[10px] bg-stone-100 text-stone-600 px-2 py-0.5 rounded-md font-medium shrink-0">
                                <i class="fa-solid fa-location-dot text-amber-600 mr-1"></i>${spot.area}
                            </span>
                        </div>
                        <p class="text-xs text-stone-600 line-clamp-2 my-2 leading-relaxed">${spot.desc}</p>
                        
                        <div class="bg-amber-50/70 rounded-lg p-2 border border-amber-100 flex items-center justify-between text-[11px] mb-3">
                            <span class="text-stone-700 font-medium truncate"><i class="fa-solid fa-star text-amber-500 mr-1"></i>${spot.highlight}</span>
                            <span class="text-stone-500 text-[10px] shrink-0"><i class="fa-regular fa-clock mr-1"></i>${spot.timing}</span>
                        </div>

                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.mapQuery)}" target="_blank" 
                            class="w-full bg-stone-900 hover:bg-amber-800 text-white py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition">
                            <i class="fa-solid fa-diamond-turn-right text-amber-400"></i>
                            <span>Google Maps वर दिशा पहा</span>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Filter Logic
        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-pill').forEach(btn => btn.classList.remove('active-pill'));
            const activeBtn = document.getElementById(`btn-${cat}`);
            if (activeBtn) activeBtn.classList.add('active-pill');
            document.getElementById('currentFilterLabel').innerText = categoryLabels[cat] || "सर्व";
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            let filtered = spots;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(s => s.category === currentCategory);
            }

            if (query !== '') {
                filtered = filtered.filter(s => 
                    s.name.toLowerCase().includes(query) ||
                    s.marathiName.toLowerCase().includes(query) ||
                    s.area.toLowerCase().includes(query) ||
                    s.desc.toLowerCase().includes(query) ||
                    s.highlight.toLowerCase().includes(query)
                );
            }
            renderSpots(filtered);
        }

        // Tour Plan / Wishlist Logic
        function toggleSaveSpot(id) {
            if (userPlan.includes(id)) {
                userPlan = userPlan.filter(item => item !== id);
            } else {
                userPlan.push(id);
            }
            localStorage.setItem('godaNashikPlan', JSON.stringify(userPlan));
            updatePlanBadge();
            applyFilters();
        }

        function updatePlanBadge() {
            document.getElementById('planBadge').innerText = userPlan.length;
        }

        function openPlanModal() {
            const container = document.getElementById('planItemsList');
            container.innerHTML = '';

            if (userPlan.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-stone-400">
                        <i class="fa-regular fa-bookmark text-3xl mb-2"></i>
                        <p>तुम्ही अजून कोणताही स्पॉट प्लॅनमध्ये जोडलेला नाही.</p>
                        <p class="text-[10px]">कार्डवरील हार्ट (❤️) वर क्लिक करून सेव्ह करा!</p>
                    </div>
                `;
            } else {
                const savedSpots = spots.filter(s => userPlan.includes(s.id));
                savedSpots.forEach(s => {
                    const row = document.createElement('div');
                    row.className = "flex items-center justify-between p-2.5 bg-stone-50 rounded-xl border border-stone-200";
                    row.innerHTML = `
                        <div class="truncate pr-2">
                            <h4 class="font-bold text-stone-900">${s.name}</h4>
                            <p class="text-[10px] text-stone-500">${s.marathiName} • ${s.area}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.mapQuery)}" target="_blank" class="bg-amber-600 text-white w-7 h-7 rounded-lg flex items-center justify-center"><i class="fa-solid fa-location-arrow text-[10px]"></i></a>
                            <button onclick="toggleSaveSpot(${s.id}); openPlanModal();" class="text-rose-600 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    `;
                    container.appendChild(row);
                });
            }
            document.getElementById('planModal').classList.remove('hidden');
        }

        function closePlanModal() {
            document.getElementById('planModal').classList.add('hidden');
        }

        function clearPlan() {
            userPlan = [];
            localStorage.setItem('godaNashikPlan', JSON.stringify(userPlan));
            updatePlanBadge();
            openPlanModal();
            applyFilters();
        }

        // ==========================================
        // PWA: Install App button + offline support
        // ==========================================
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installAppBtn').classList.remove('hidden');
        });
        async function installPWA() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            try { await deferredPrompt.userChoice; } catch (e) {}
            deferredPrompt = null;
            document.getElementById('installAppBtn').classList.add('hidden');
        }
        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            document.getElementById('installAppBtn').classList.add('hidden');
        });
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            updatePlanBadge();
            renderSpots(spots);
        });
    </script>
</body>
</html>
